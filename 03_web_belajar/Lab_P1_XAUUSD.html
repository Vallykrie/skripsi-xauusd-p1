<script id="lab-math">
// ===== Matematika contoh sintetis (konsisten dengan workbook Perhitungan_Manual_P1.xlsx) =====
const LabMath=(()=>{
const CLOSES=[2000,2002,2001,2004,2002,2003,2000,2002,2002,2006,2004,2005,2004,2006,2005,2008,2006,2007,2004,2006,2006,2010,2008,2009,2008,2010,2009,2012,2010,2011,2008,2010,2010,2014,2012,2013,2012,2014,2013,2016,2014,2015,2012,2014,2014,2018,2016,2017,2016,2018,2017,2020,2018,2019,2016,2018,2018,2022,2020,2021,2020];
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const std=(a,ddof=1)=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-ddof));};
function softmax(z){const m=Math.max(...z),e=z.map(x=>Math.exp(x-m)),s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s);}
function target(next=2020,mult=.5){
  const returns=CLOSES.slice(1,51).map((c,i)=>Math.log(c/CLOSES[i]));
  const win=returns.slice(-24),sigma=std(win),delta=mult*sigma,q=Math.log(next/CLOSES[50]);
  return {returns,win,mean:mean(win),sigma,delta,q,label:q>delta?'BUY':q<-delta?'SELL':'HOLD'};
}
function ema(v,p){const out=Array(v.length).fill(null);if(v.length<p)return out;out[p-1]=mean(v.slice(0,p));const a=2/(p+1);for(let i=p;i<v.length;i++)out[i]=a*v[i]+(1-a)*out[i-1];return out;}
function indicators(c=CLOSES){
  const rsi=Array(c.length).fill(null),ag=Array(c.length).fill(null),al=Array(c.length).fill(null);let g=0,l=0;
  for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],up=Math.max(d,0),dn=Math.max(-d,0);
    if(i<=14){g+=up;l+=dn;if(i===14){g/=14;l/=14;}}else{g=(13*g+up)/14;l=(13*l+dn)/14;}
    if(i>=14){ag[i]=g;al[i]=l;rsi[i]=g===0&&l===0?50:l===0?100:100-100/(1+g/l);}}
  const e12=ema(c,12),e26=ema(c,26),macd=c.map((_,i)=>e26[i]===null?null:e12[i]-e26[i]);
  const sig=[...Array(25).fill(null),...ema(macd.slice(25),9)];
  return {rsi,ag,al,e12,e26,macd,sig,hist:macd.map((m,i)=>sig[i]===null?null:m-sig[i])};
}
// Data latih kecil: satu fitur x, label 0=SELL,1=HOLD,2=BUY, bobot kelas 1.
const TX=[-2,-1,0,1,2,3],TY=[0,0,1,1,2,2];
function logistic(eta=.1){
  const mu=mean(TX),sd=std(TX,0),xs=TX.map(v=>(v-mu)/sd);
  const grad=[0,1,2].map(c=>xs.reduce((s,v,i)=>s+(1/3-(TY[i]===c?1:0))*v,0));
  const beta=grad.map(g=>-eta*g);
  const G=TX.map((_,i)=>[0,1,2].map(c=>1/3-(TY[i]===c?1:0)));
  return {mu,sd,xs,grad,beta,G,prob:(x,t=1)=>softmax(beta.map(b=>t*b*(x-mu)/sd))};
}
// Pohon gradient boosting: pencarian greedy semua titik tengah; lambda=1, gamma=0, min_child_weight=0.5.
function buildTree(g,h,maxDepth,lambda=1,mcw=.5){
  const events=[];
  function grow(idx,depth,id){
    const G=idx.reduce((s,i)=>s+g[i],0),H=idx.reduce((s,i)=>s+h[i],0);
    const node={id,idx,G,H,w:-G/(H+lambda),depth};
    if(depth>=maxDepth){node.reason='depth';events.push({type:'leaf',node});return node;}
    const cands=[];
    for(let k=1;k<idx.length;k++){
      const L=idx.slice(0,k),R=idx.slice(k),cut=(TX[idx[k-1]]+TX[idx[k]])/2;
      const gl=L.reduce((s,i)=>s+g[i],0),hl=L.reduce((s,i)=>s+h[i],0),gr=G-gl,hr=H-hl;
      cands.push({cut,L,R,gl,hl,gr,hr,valid:hl>=mcw&&hr>=mcw,gain:.5*(gl*gl/(hl+lambda)+gr*gr/(hr+lambda)-G*G/(H+lambda))});
    }
    let best=null;for(const c of cands)if(c.valid&&(!best||c.gain>best.gain+1e-12))best=c;
    events.push({type:'scan',node,cands,best});
    if(!best||best.gain<=1e-12){node.reason=best?'gain':cands.length?'mcw':'single';events.push({type:'leaf',node});return node;}
    node.cut=best.cut;node.gain=best.gain;events.push({type:'split',node});
    node.left=grow(best.L,depth+1,id+'L');node.right=grow(best.R,depth+1,id+'R');return node;
  }
  return {root:grow(TX.map((_,i)=>i),0,'R'),events};
}
function leafOf(n,x){const path=[n];while(n.left){n=x<n.cut?n.left:n.right;path.push(n);}return path;}
function boost(maxDepth=2,rounds=3,eta=.1){
  let F=TX.map(()=>[0,0,0]);const out=[];
  for(let r=0;r<rounds;r++){
    const P=F.map(softmax);
    const trees=[0,1,2].map(c=>{const g=TY.map((y,i)=>P[i][c]-(y===c?1:0)),h=P.map(p=>Math.max(2*p[c]*(1-p[c]),1e-16));return {...buildTree(g,h,maxDepth),g,h};});
    out.push({F:F.map(a=>a.slice()),P,trees});
    F=F.map((z,i)=>z.map((v,c)=>v+eta*leafOf(trees[c].root,TX[i]).at(-1).w));
  }
  return out;
}
function predict(rounds,x,upto,eta=.1){let z=[0,0,0];for(let r=0;r<upto;r++)z=z.map((v,c)=>v+eta*leafOf(rounds[r].trees[c].root,x).at(-1).w);return z;}
function metrics(m){ // baris = label benar, kolom = prediksi
  const cls=m.map((row,i)=>{const tp=row[i],sup=row.reduce((a,b)=>a+b,0),col=m.reduce((s,r)=>s+r[i],0),fp=col-tp,fn=sup-tp;
    return {tp,fp,fn,sup,col,precision:col?tp/col:0,recall:sup?tp/sup:null,f1:(2*tp+fp+fn)?2*tp/(2*tp+fp+fn):0};});
  const n=m.flat().reduce((a,b)=>a+b,0);
  return {cls,n,macroF1:mean(cls.map(c=>c.f1)),balanced:mean(cls.map(c=>c.recall)),accuracy:m.reduce((s,r,i)=>s+r[i],0)/n};
}
return {CLOSES,mean,std,softmax,target,ema,indicators,TX,TY,logistic,buildTree,leafOf,boost,predict,metrics};
})();
if(typeof module!=='undefined')module.exports=LabMath;
</script>

<script>
(()=>{
const M=LabMath;
const $=(s,r=document)=>r.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function S(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function T(parent,x,y,s,attrs={}){const t=S('text',{x,y,...attrs},parent);t.textContent=s;return t;}
function H(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function svg(w,h){return S('svg',{viewBox:`0 0 ${w} ${h}`,role:'img'});}
const f=(v,d=3)=>{if(v==null||Number.isNaN(v))return '—';const r=Number(v.toFixed(d));const s=Math.abs(r).toFixed(d).replace('.',',');return r<0?'−'+s:s;};
const sg=(v,d=3)=>(v>0?'+':'')+f(v,d);
const CN=['SELL','HOLD','BUY'],CK=['S','H','B'],CF=['fs','fh','fb'],CS=['ss','sh','sb'],CV=['var(--sell)','var(--hold)','var(--buy)'];
const lab=c=>`<span class="lab ${CK[c]}">${CN[c]}</span>`;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const later=(fn,ms)=>setTimeout(fn,reduced?0:ms);

// ===== Mesin langkah =====

function seg(id,opts,val,onpick){
  const w=H(`<div class="seg" role="group" id="${id}"></div>`);
  opts.forEach(([v,l])=>{const b=H(`<button type="button" aria-pressed="${v===val}">${l}</button>`);b.onclick=()=>{w.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');onpick(v);};w.appendChild(b);});
  return w;
}
function ctrl(label,node){const c=H(`<label class="ctrl"><span>${label}</span></label>`);c.appendChild(node);return c;}
function range(id,min,max,stp,val,oninput,fmt=v=>v){
  const wrap=document.createElement('span');wrap.style.display='inline-flex';wrap.style.gap='8px';wrap.style.alignItems='center';
  const r=H(`<input type="range" id="${id}" min="${min}" max="${max}" step="${stp}" value="${val}">`),o=H(`<output class="mono">${fmt(val)}</output>`);
  r.oninput=()=>{o.textContent=fmt(+r.value);oninput(+r.value);};wrap.append(r,o);return wrap;
}
function buildShell(){
  const nav=$('#chapNav'),main=$('#main');
  CH.forEach((c,i)=>{
    const b=H(`<button type="button" data-id="${c.id}"><span class="n">${String(i).padStart(2,'0')}</span>${c.short}</button>`);
    b.onclick=()=>go(c.id);nav.appendChild(b);
    const sec=H(`<section id="sec-${c.id}" hidden aria-labelledby="h-${c.id}">
      <div class="chapter-head"><h2 id="h-${c.id}">${c.title}</h2><p>${c.lede}</p></div>
      <div class="layout"><aside class="narr" aria-label="Langkah"><ol></ol></aside>
      <div class="stage"><div class="panel ctrls"></div><div class="panel caption"></div><div class="panel vis"></div>
      <div class="panel stepbar"><button class="btn" data-a="prev" type="button">← Sebelumnya</button><span class="count"></span><div class="prog"><i></i></div><button class="btn" data-a="play" type="button">▶ Putar</button><button class="btn primary" data-a="next" type="button">Berikutnya →</button></div></div></div></section>`);
    main.appendChild(sec);c.sec=sec;c.vis=$('.vis',sec);c.ctrls=$('.ctrls',sec);
    sec.querySelector('[data-a=prev]').onclick=()=>{stop();setStep(step-1);};
    sec.querySelector('[data-a=next]').onclick=()=>{stop();setStep(step+1);};

  });
}
function go(id,keepStep){
  stop();const c=CH.find(x=>x.id===id)||CH[0];
  if(active)active.sec.hidden=true;active=c;c.sec.hidden=false;
  document.querySelectorAll('#chapNav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===c.id)));
  if(!c.ready){c.init&&c.init();c.ready=true;}
  if(!keepStep)step=0;lastKey='';
  try{history.replaceState(null,'','#'+c.id);}catch(e){}
  try{localStorage.setItem('labp1-ch',c.id);}catch(e){}
  render();
  const nb=document.querySelector(`#chapNav button[data-id="${c.id}"]`);nb&&nb.scrollIntoView({block:'nearest',inline:'nearest'});
}
function setStep(i){const n=active.steps().length;step=Math.max(0,Math.min(n-1,i));render();}
function render(){
  const c=active,steps=c.steps();step=Math.min(step,steps.length-1);const s=steps[step];
  const ol=$('.narr ol',c.sec);ol.innerHTML='';
  steps.forEach((st,i)=>{const li=document.createElement('li');li.className=i===step?'on':i<step?'done':'';
    const b=H(`<button type="button">${st.t}</button>`);b.onclick=()=>{stop();setStep(i);};li.appendChild(b);
    if(i===step&&st.d){li.appendChild(H(`<div class="desc">${st.d}</div>`));}ol.appendChild(li);});
  $('.caption',c.sec).innerHTML=`<b>${step+1}. ${s.t}</b>`;
  $('.count',c.sec).textContent=`${step+1} / ${steps.length}`;
  $('.prog i',c.sec).style.width=`${(step+1)/steps.length*100}%`;
  $('[data-a=prev]',c.sec).disabled=step===0;$('[data-a=next]',c.sec).disabled=step===steps.length-1;
  $('[data-a=play]',c.sec).textContent=timer?'❚❚ Jeda':step===steps.length-1?'↺ Ulangi':'▶ Putar';
  c.draw(step,s,steps);
}
function play(){
  if(step>=active.steps().length-1)step=-1;
  const tick=()=>{if(step>=active.steps().length-1){stop();return;}setStep(step+1);timer=setTimeout(tick,active.pace||3600);};
  timer=1;tick();
}
function stop(){if(timer&&timer!==1)clearTimeout(timer);timer=null;if(active)$('[data-a=play]',active.sec).textContent=step===active.steps().length-1?'↺ Ulangi':'▶ Putar';}
