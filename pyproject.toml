[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "skripsi-xauusd-p1"
version = "0.1.0"
description = "P1 XAUUSD: reproducible research code and manual calculation lessons"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=16,<24", "scikit-learn>=1.6,<2", "xgboost==2.1.4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
target-version = "py311"
